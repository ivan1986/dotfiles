# kitty.conf — minimal custom config (kitty 0.49)
# Reload: ctrl+shift+f5 | Debug: ctrl+shift+f6

# --- Fonts -------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor
# Extra line height for readability
modify_font cell_height 110%

# --- Cursor ------------------------------------------------------------------
cursor_shape          beam
cursor_blink_interval 0
cursor_trail          3

# --- Scrollback --------------------------------------------------------------
scrollback_lines       20000
# Open full scrollback in pager (ctrl+shift+h)
scrollback_pager       less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 64
wheel_scroll_multiplier 3.0

# --- Mouse / clipboard -------------------------------------------------------
copy_on_select        clipboard
strip_trailing_spaces smart
mouse_hide_wait       2.0
url_style             curly
detect_urls           yes
# ctrl+click opens links (plain click selects text)
mouse_map left click ungrabbed no-op
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left press ungrabbed mouse_selection normal

# --- Bell --------------------------------------------------------------------
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes

# --- Window ------------------------------------------------------------------
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c
window_padding_width  4 8
placement_strategy    top-left
enabled_layouts       splits, stack, tall
inactive_text_alpha   0.75
confirm_os_window_close -1
window_border_width   1pt
draw_minimal_borders  yes

# --- Tab bar -----------------------------------------------------------------
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    "{index}: {title[:30]}{' []' if layout_name == 'stack' else ''}"

# --- Shell / misc ------------------------------------------------------------
shell                 .
shell_integration     enabled
allow_remote_control  socket-only
listen_on             unix:@kitty-{kitty_pid}
update_check_interval 0
term                  xterm-kitty

# --- Keybindings (kitty_mod = ctrl+shift) ------------------------------------
kitty_mod ctrl+shift

# Splits: new pane in same cwd
map kitty_mod+enter launch --location=hsplit --cwd=current
map kitty_mod+\     launch --location=vsplit --cwd=current
map kitty_mod+z     toggle_layout stack
map kitty_mod+r     start_resizing_window

# Pane navigation
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map kitty_mod+left  move_window left
map kitty_mod+right move_window right
map kitty_mod+up    move_window up
map kitty_mod+down  move_window down

# Tabs
map kitty_mod+t     new_tab_with_cwd
map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map shift+right      next_tab
map shift+left       previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Font size
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Scrollback / output (needs shell integration)
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output
map kitty_mod+k clear_terminal to_cursor active

# Hints: pick url / path / line from screen
map kitty_mod+e open_url_with_hints
map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>l kitten hints --type line --program -

# --- Theme: Catppuccin Mocha -------------------------------------------------
# Switch theme interactively: kitty +kitten themes
foreground              #CDD6F4
background              #000000
